[project]
name = "supplyguard"
version = "0.1.0"
description = "Supply chain security analyzer: SCA, typosquat, dependency confusion, malicious package and CI/CD integrity detection."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "arq>=0.26",
    "typer>=0.15",
    "rich>=13.9",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=5.0.0",
    "python-multipart>=0.0.17",
    "packaging>=24.2",
    "PyYAML>=6.0",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "respx>=0.21",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
supplyguard = "supplyguard.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/supplyguard"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore::DeprecationWarning",
    # Starlette renamed the 422 constant; FastAPI still emits the old one.
    "ignore:.*HTTP_422_UNPROCESSABLE_ENTITY.*:DeprecationWarning",
    "ignore::UserWarning",
]
# Network tests are opt-in: `pytest -m network`.
addopts = "-m 'not network'"
markers = [
    "network: hits real external APIs (OSV, registries, GitHub)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
