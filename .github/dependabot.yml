# SHA-pinned actions are immutable, which is the point — but immutable also
# means they never get security fixes on their own. Dependabot bumps the SHA
# and rewrites the trailing version comment, so pinning costs no staleness.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    commit-message:
      prefix: deps(frontend)
    # Peer-coupled packages have to move together or not at all. Ungrouped,
    # Dependabot opened one PR raising vite to 8 (which plugin-react 4 refuses
    # as a peer) and another raising plugin-react to 6 (which demands vite 8) —
    # each PR blocked by the change sitting in the other, so both failed `npm
    # ci` forever. Grouping makes that one PR that resolves.
    groups:
      vite:
        patterns:
          - vite
          - "@vitejs/*"
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
