name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Least privilege: nothing here writes to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Lint, type-check and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff
        run: uv run ruff check .

      - name: mypy
        run: uv run mypy src

      # Network tests are excluded by the `addopts` in pyproject.toml, so the
      # suite stays deterministic and does not depend on OSV or the registries
      # being reachable from a runner.
      - name: pytest
        run: uv run pytest -q

  frontend:
    name: Dashboard type-check and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` fails if package.json and the lockfile have drifted. A tool
      # that reports unpinned dependencies should not have any of its own.
      - name: Install
        run: npm ci --no-audit --no-fund
        working-directory: frontend

      - name: Type-check
        run: npm run lint
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Build only — never pushed. This job exists because the image was
      # otherwise unexercised: the compose file parsed and every COPY source
      # was verified present, but nothing had actually run the build.
      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: supplyguard:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A built image that cannot import its own entrypoint is not a passing
      # build. This catches a broken COPY or a missing dependency.
      - name: Smoke-test the image
        run: docker run --rm supplyguard:ci python -c "import supplyguard.api.app; print('entrypoint imports OK')"
